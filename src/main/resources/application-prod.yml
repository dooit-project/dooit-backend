spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${TODOLAB_DB_URL}
    username: ${TODOLAB_DB_USERNAME}
    password: ${TODOLAB_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
    open-in-view: false

  batch:
    jdbc:
      initialize-schema: never
    job:
      enabled: false

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${TODOLAB_MAIL_USERNAME}
    password: ${TODOLAB_MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls.enable: true

app:
  auth:
    jwt:
      issuer: ${TODOLAB_JWT_ISSUER}
      secret: ${TODOLAB_JWT_SECRET}
      access-token-ttl: ${TODOLAB_JWT_ACCESS_TOKEN_TTL:PT1H}

  cors:
    allowed-origins: ${TODOLAB_ALLOWED_ORIGINS:}

  docs:
    public-enabled: ${TODOLAB_DOCS_PUBLIC_ENABLED:false}

  api-logging:
    enabled: ${TODOLAB_API_LOGGING_ENABLED:true}
    payload-enabled: ${TODOLAB_API_LOGGING_PAYLOAD_ENABLED:false}
    max-payload-length: ${TODOLAB_API_LOGGING_MAX_PAYLOAD_LENGTH:4096}
    payload-excluded-paths:
      - /api/auth
      - /api/v1/auth

  batch:
    scheduler:
      enabled: true

  mail:
    daily-summary:
      to: ${TODOLAB_DAILY_SUMMARY_TO}

logging:
  file:
    path: ${TODOLAB_LOG_PATH:./logs}
  level:
    org.hibernate.SQL: INFO
    org.hibernate.orm.jdbc.bind: INFO

springdoc:
  api-docs:
    enabled: ${TODOLAB_SPRINGDOC_API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${TODOLAB_SPRINGDOC_SWAGGER_UI_ENABLED:false}
