spring:
  profiles:
    active: local

  threads:
    virtual:
      enabled: true

app:
  auth:
    jwt:
      issuer: https://todolab.local
      secret: ${TODOLAB_JWT_SECRET:dev-only-not-for-production-jwt-secret}
      access-token-ttl: PT1H
      guest-access-token-ttl: P31D
    guest:
      cleanup:
        enabled: false
        cron: "0 30 3 * * *"
      rate-limit:
        enabled: true
        store: memory
        max-requests: 30
        window: PT1H
        max-tracked-keys: 10000

  cors:
    allowed-origins: http://localhost:8081,http://localhost:8090

  docs:
    public-enabled: true

  api-logging:
    enabled: true
    payload-enabled: true
    max-payload-length: 65536
    sensitive-headers: []
    sensitive-query-parameters: []
    sensitive-payload-fields: []
    payload-excluded-paths: []

  notification:
    push:
      enabled: false
      provider: EXPO
      endpoint: https://exp.host/--/api/v2/push/send
      access-token:

  batch:
    scheduler:
      enabled: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui
    display-request-duration: true
    operations-sorter: method

management:
  health:
    redis:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      validate-group-membership: false
      probes:
        enabled: true
      show-components: always
      show-details: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,schema
