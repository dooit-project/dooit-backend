spring:
  profiles:
    active: local

  threads:
    virtual:
      enabled: true

app:
  auth:
    jwt:
      issuer: https://todolab.local
      secret: ${TODOLAB_JWT_SECRET:dev-only-not-for-production-jwt-secret}
      access-token-ttl: PT1H

  cors:
    allowed-origins: http://localhost:8081,http://localhost:8090

  docs:
    public-enabled: true

  batch:
    scheduler:
      enabled: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui
    display-request-duration: true
    operations-sorter: method
