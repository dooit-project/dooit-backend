spring:
  profiles:
    active: local

  threads:
    virtual:
      enabled: true

app:
  auth:
    jwt:
      issuer: https://todolab.local
      secret: ${TODOLAB_JWT_SECRET:dev-only-not-for-production-jwt-secret}
      access-token-ttl: PT15M
      guest-access-token-ttl: P31D
    guest:
      cleanup:
        enabled: false
        cron: "0 30 3 * * *"
      rate-limit:
        enabled: true
        store: memory
        max-requests: 30
        window: PT1H
        max-tracked-keys: 10000
    password-reset:
      token-ttl: PT30M
      rate-limit-window: PT1H
      max-requests-per-window: 5
      link-template: "${TODOLAB_PASSWORD_RESET_LINK_TEMPLATE:todolab://password-reset?token={token}}"
    refresh-token:
      idle-ttl: P30D
      absolute-ttl: P90D

  cors:
    allowed-origins: http://localhost:8081,http://localhost:8090

  docs:
    public-enabled: true

  metadata:
    version: ${TODOLAB_APP_VERSION:1.0-SNAPSHOT}
    commit-sha: ${TODOLAB_APP_COMMIT_SHA:local}
    image-tag: ${TODOLAB_APP_IMAGE_TAG:local}

  api-logging:
    enabled: true
    payload-enabled: true
    max-payload-length: 65536
    sensitive-headers: []
    sensitive-query-parameters: []
    sensitive-payload-fields: []
    payload-excluded-paths: []

  notification:
    push:
      enabled: false
      provider: EXPO
      endpoint: https://exp.host/--/api/v2/push/send
      access-token:
      scheduler-fixed-delay: PT1M
      look-ahead-window: PT10M

  batch:
    scheduler:
      enabled: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui
    display-request-duration: true
    operations-sorter: method

management:
  health:
    redis:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      validate-group-membership: false
      probes:
        enabled: true
      show-components: always
      show-details: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,schema
