services:
  mysql:
    image: mysql:8.0
    container_name: todolab-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${TODOLAB_MYSQL_ROOT_PASSWORD:?TODOLAB_MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${TODOLAB_MYSQL_DATABASE:?TODOLAB_MYSQL_DATABASE is required}
      MYSQL_USER: ${TODOLAB_DB_USERNAME:?TODOLAB_DB_USERNAME is required}
      MYSQL_PASSWORD: ${TODOLAB_DB_PASSWORD:?TODOLAB_DB_PASSWORD is required}
      TZ: Asia/Seoul
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - todolab-mysql-data:/var/lib/mysql
      - ./src/main/resources/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  app:
    image: todolab-backend:${TODOLAB_APP_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${TODOLAB_APP_IMAGE_TAG:-local}
    container_name: todolab-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TODOLAB_DB_URL: ${TODOLAB_DB_URL:?TODOLAB_DB_URL is required}
      TODOLAB_DB_USERNAME: ${TODOLAB_DB_USERNAME:?TODOLAB_DB_USERNAME is required}
      TODOLAB_DB_PASSWORD: ${TODOLAB_DB_PASSWORD:?TODOLAB_DB_PASSWORD is required}
      TODOLAB_JWT_ISSUER: ${TODOLAB_JWT_ISSUER:?TODOLAB_JWT_ISSUER is required}
      TODOLAB_JWT_SECRET: ${TODOLAB_JWT_SECRET:?TODOLAB_JWT_SECRET is required}
      TODOLAB_JWT_ACCESS_TOKEN_TTL: ${TODOLAB_JWT_ACCESS_TOKEN_TTL:-PT15M}
      TODOLAB_GUEST_JWT_ACCESS_TOKEN_TTL: ${TODOLAB_GUEST_JWT_ACCESS_TOKEN_TTL:-P31D}
      TODOLAB_PASSWORD_RESET_TOKEN_TTL: ${TODOLAB_PASSWORD_RESET_TOKEN_TTL:-PT30M}
      TODOLAB_PASSWORD_RESET_RATE_LIMIT_WINDOW: ${TODOLAB_PASSWORD_RESET_RATE_LIMIT_WINDOW:-PT1H}
      TODOLAB_PASSWORD_RESET_MAX_REQUESTS_PER_WINDOW: ${TODOLAB_PASSWORD_RESET_MAX_REQUESTS_PER_WINDOW:-5}
      TODOLAB_PASSWORD_RESET_LINK_TEMPLATE: ${TODOLAB_PASSWORD_RESET_LINK_TEMPLATE:-todolab://password-reset?token={token}}
      TODOLAB_REFRESH_TOKEN_IDLE_TTL: ${TODOLAB_REFRESH_TOKEN_IDLE_TTL:-P30D}
      TODOLAB_REFRESH_TOKEN_ABSOLUTE_TTL: ${TODOLAB_REFRESH_TOKEN_ABSOLUTE_TTL:-P90D}
      TODOLAB_MAIL_USERNAME: ${TODOLAB_MAIL_USERNAME:-}
      TODOLAB_MAIL_PASSWORD: ${TODOLAB_MAIL_PASSWORD:-}
      TODOLAB_DAILY_SUMMARY_TO: ${TODOLAB_DAILY_SUMMARY_TO:-}
      APP_BATCH_SCHEDULER_ENABLED: ${APP_BATCH_SCHEDULER_ENABLED:-false}
      TODOLAB_ALLOWED_ORIGINS: ${TODOLAB_ALLOWED_ORIGINS:-}
      TODOLAB_DOCS_PUBLIC_ENABLED: ${TODOLAB_DOCS_PUBLIC_ENABLED:-false}
      TODOLAB_SPRINGDOC_API_DOCS_ENABLED: ${TODOLAB_SPRINGDOC_API_DOCS_ENABLED:-false}
      TODOLAB_SPRINGDOC_SWAGGER_UI_ENABLED: ${TODOLAB_SPRINGDOC_SWAGGER_UI_ENABLED:-false}
      TODOLAB_APP_VERSION: ${TODOLAB_APP_VERSION:-1.0-SNAPSHOT}
      TODOLAB_APP_COMMIT_SHA: ${TODOLAB_APP_COMMIT_SHA:-local}
      TODOLAB_APP_IMAGE_TAG: ${TODOLAB_APP_IMAGE_TAG:-local}
      TODOLAB_API_LOGGING_ENABLED: "true"
      TODOLAB_API_LOGGING_PAYLOAD_ENABLED: "false"
      TODOLAB_LOG_PATH: /app/logs
      TZ: Asia/Seoul
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - todolab-app-logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/actuator/health/readiness >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  todolab-mysql-data:
    external: true
    name: todolab-mysql-data
  todolab-app-logs:
